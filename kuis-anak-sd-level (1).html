<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kuis Pintar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap');

:root{
  --sun:#FFC93C;
  --sky:#4FC3F7;
  --sky-deep:#29B6F6;
  --pink:#FF6F91;
  --green:#6BCB77;
  --purple:#9B5DE5;
  --ink:#2B2D42;
  --white:#FFFFFF;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Nunito',sans-serif;
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky-deep) 45%,#81D4FA 100%);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px 14px;
}

.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.85;}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%;}
.c1{width:90px;height:34px;top:6%;left:6%;animation:drift 18s linear infinite;}
.c1::before{width:46px;height:46px;top:-22px;left:10px;}
.c1::after{width:34px;height:34px;top:-16px;left:46px;}
.c2{width:70px;height:26px;top:14%;right:8%;animation:drift 24s linear infinite reverse;}
.c2::before{width:36px;height:36px;top:-18px;left:8px;}
.c2::after{width:26px;height:26px;top:-12px;left:34px;}
.c3{width:60px;height:24px;bottom:8%;left:10%;animation:drift 20s linear infinite;}
.c3::before{width:30px;height:30px;top:-15px;left:6px;}
.c3::after{width:22px;height:22px;top:-10px;left:28px;}
@keyframes drift{0%{transform:translateX(-20px);}50%{transform:translateX(20px);}100%{transform:translateX(-20px);}}

.card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:460px;
  background:var(--white);
  border-radius:32px;
  padding:26px 22px 30px;
  box-shadow:0 20px 0 rgba(43,45,66,.12), 0 20px 40px rgba(43,45,66,.18);
}

.mascot-wrap{display:flex;justify-content:center;margin-top:-64px;margin-bottom:6px;}
.mascot{width:92px;height:92px;animation:bob 2.4s ease-in-out infinite;transform-origin:center;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-8px) rotate(3deg);}}
.mascot.happy{animation:happyBounce .6s ease;}
@keyframes happyBounce{0%{transform:scale(1);}30%{transform:scale(1.25) rotate(8deg);}60%{transform:scale(.95) rotate(-6deg);}100%{transform:scale(1);}}
.mascot.oops{animation:shake .5s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px) rotate(-4deg);}40%{transform:translateX(8px) rotate(4deg);}60%{transform:translateX(-6px) rotate(-3deg);}80%{transform:translateX(6px) rotate(3deg);}}

h1.title{font-family:'Baloo 2',cursive;text-align:center;color:var(--ink);font-size:26px;margin:0 0 4px;}
.subtitle{text-align:center;color:#6b6f8a;font-weight:700;font-size:14px;margin:0 0 18px;}

/* ---- Home / pilih level ---- */
.total-stars-pill{
  display:flex;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(90deg,#FFE9A8,#FFD46B);
  border-radius:20px;padding:8px 14px;margin:0 auto 18px;
  font-family:'Baloo 2',cursive;font-weight:800;color:var(--ink);font-size:14px;
  width:fit-content;
}
.level-list{display:flex;flex-direction:column;gap:12px;}
.level-card{
  display:flex;align-items:center;gap:14px;
  background:#F4F6FB;border:3px solid #E4E8F5;border-radius:20px;
  padding:14px 16px;cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease;
}
.level-card:active{transform:scale(.97);}
.level-card:hover{border-color:var(--sky-deep); transform:translateY(-2px); box-shadow:0 5px 0 #E4E8F5;}
.level-badge{
  width:48px;height:48px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Baloo 2',cursive;font-weight:800;font-size:20px;color:#fff;
  flex-shrink:0;
}
.lv1 .level-badge{background:var(--green);}
.lv2 .level-badge{background:var(--sky-deep);}
.lv3 .level-badge{background:var(--purple);}
.level-info{flex:1; min-width:0;}
.level-name{font-family:'Baloo 2',cursive;font-weight:700;font-size:16px;color:var(--ink);margin:0 0 3px;}
.level-desc{font-size:12px;color:#8085a3;font-weight:700;margin:0 0 4px;}
.level-score{font-size:13px;font-weight:800;color:var(--purple);}
.level-arrow{font-size:20px;color:#c3c7dd;}

/* ---- progress kuis ---- */
.progress-row{display:flex;gap:6px;justify-content:center;margin-bottom:20px;flex-wrap:wrap;}
.dot{width:20px;height:8px;border-radius:5px;background:#EDEFF7;transition:all .3s ease;}
.dot.done{background:var(--green);}
.dot.current{background:var(--purple); width:28px;}

.question-box{
  background:linear-gradient(135deg,#FFF6DE,#FFEFC2);
  border-radius:22px;padding:20px 18px;text-align:center;margin-bottom:18px;
  min-height:78px;display:flex;align-items:center;justify-content:center;
}
.question-box p{font-family:'Baloo 2',cursive;font-size:19px;color:var(--ink);margin:0;line-height:1.35;}

.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.answer-btn{
  font-family:'Baloo 2',cursive;font-size:16px;font-weight:700;color:var(--ink);
  background:#F4F6FB;border:3px solid #E4E8F5;border-radius:20px;padding:15px 8px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:transform .12s ease, box-shadow .12s ease; user-select:none;
}
.answer-btn .emoji{font-size:28px;}
.answer-btn:active{transform:scale(.96);}
.answer-btn:not(:disabled):hover{transform:translateY(-3px);box-shadow:0 6px 0 #E4E8F5;border-color:var(--sky-deep);}
.answer-btn.correct{background:#E4F9E6;border-color:var(--green);color:#237A3A;}
.answer-btn.wrong{background:#FFE7EC;border-color:var(--pink);color:#B23355;}
.answer-btn:disabled{cursor:default;}
.answer-btn:disabled:not(.correct):not(.wrong){opacity:.5;}

.feedback{text-align:center;font-family:'Baloo 2',cursive;font-weight:700;font-size:16px;min-height:26px;margin-top:14px;color:var(--purple);}

.next-btn{
  display:block;width:100%;margin-top:14px;font-family:'Baloo 2',cursive;font-size:16px;font-weight:700;
  color:#fff;background:var(--purple);border:none;border-radius:16px;padding:14px;cursor:pointer;
  box-shadow:0 6px 0 #7238C9; transition:transform .1s ease;
}
.next-btn:active{transform:translateY(4px); box-shadow:0 2px 0 #7238C9;}
.next-btn.hidden{display:none;}

.back-btn{
  background:none;border:none;color:#8085a3;font-weight:800;font-size:13px;
  cursor:pointer;margin-bottom:10px;display:flex;align-items:center;gap:4px;padding:4px 0;
}

.score-pill{
  position:absolute;top:16px;right:16px;background:var(--sun);color:var(--ink);
  font-family:'Baloo 2',cursive;font-weight:800;font-size:14px;padding:6px 12px;
  border-radius:20px;z-index:3;box-shadow:0 3px 0 #E0A800;
}

.end-screen{display:none;text-align:center;}
.end-screen.show{display:block;}
.trophy{font-size:70px;margin-bottom:6px;animation:popIn .5s ease;}
@keyframes popIn{0%{transform:scale(0);}70%{transform:scale(1.15);}100%{transform:scale(1);}}
.end-title{font-family:'Baloo 2',cursive;font-size:24px;color:var(--ink);margin:0 0 4px;}
.end-sub{color:#6b6f8a;font-weight:700;margin:0 0 6px;}
.new-best{color:var(--pink);font-weight:800;font-size:13px;margin:0 0 14px;min-height:16px;}
.stars{font-size:34px;letter-spacing:6px;margin-bottom:20px;}
.end-buttons{display:flex;gap:10px;}
.end-buttons button{
  flex:1;font-family:'Baloo 2',cursive;font-size:14px;font-weight:700;color:#fff;
  border:none;border-radius:16px;padding:13px 6px;cursor:pointer;
}
#retryBtn{background:var(--pink); box-shadow:0 6px 0 #D4506D;}
#retryBtn:active{transform:translateY(4px); box-shadow:0 2px 0 #D4506D;}
#toHomeBtn{background:var(--sky-deep); box-shadow:0 6px 0 #1E88C7;}
#toHomeBtn:active{transform:translateY(4px); box-shadow:0 2px 0 #1E88C7;}

#homeScreen, #endScreen{display:none;}
#homeScreen.show{display:block;}

.confetti{position:fixed;top:-10px;z-index:10;pointer-events:none;font-size:22px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2;}}

@media (max-width:380px){
  .card{padding:22px 16px 24px;border-radius:26px;}
  .question-box p{font-size:17px;}
  .answer-btn{font-size:14px;padding:13px 6px;}
}
</style>
</head>
<body>

<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>

<div class="card">
  <div class="score-pill" id="scorePill">⭐ <span id="scoreVal">0</span>/<span id="totalVal">10</span></div>

  <div class="mascot-wrap">
    <svg class="mascot" id="mascot" viewBox="0 0 100 100">
      <g stroke="#FFB300" stroke-width="6" stroke-linecap="round">
        <line x1="50" y1="4" x2="50" y2="16"/><line x1="50" y1="84" x2="50" y2="96"/>
        <line x1="4" y1="50" x2="16" y2="50"/><line x1="84" y1="50" x2="96" y2="50"/>
        <line x1="16" y1="16" x2="24" y2="24"/><line x1="76" y1="76" x2="84" y2="84"/>
        <line x1="84" y1="16" x2="76" y2="24"/><line x1="16" y1="84" x2="24" y2="76"/>
      </g>
      <circle cx="50" cy="50" r="30" fill="#FFC93C"/>
      <circle cx="40" cy="46" r="4.5" fill="#2B2D42"/>
      <circle cx="60" cy="46" r="4.5" fill="#2B2D42"/>
      <path id="mouth" d="M38,58 Q50,68 62,58" stroke="#2B2D42" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="32" cy="56" r="5" fill="#FF9AAE" opacity=".7"/>
      <circle cx="68" cy="56" r="5" fill="#FF9AAE" opacity=".7"/>
    </svg>
  </div>

  <h1 class="title">Kuis Pintar</h1>

  <!-- ===== HOME: pilih level ===== -->
  <div id="homeScreen" class="show">
    <p class="subtitle">Pilih level untuk mulai bermain!</p>
    <div class="total-stars-pill">🏆 Total Bintang: <span id="totalStars">0</span>/9</div>
    <div class="level-list" id="levelList"></div>
  </div>

  <!-- ===== QUIZ ===== -->
  <div id="quizArea">
    <button class="back-btn" id="backBtn">← Pilih level lain</button>
    <div class="progress-row" id="progressRow"></div>
    <div class="question-box"><p id="questionText">Memuat soal...</p></div>
    <div class="answers" id="answersGrid"></div>
    <p class="feedback" id="feedbackText"></p>
    <button class="next-btn hidden" id="nextBtn">Lanjut &rarr;</button>
  </div>

  <!-- ===== END ===== -->
  <div class="end-screen" id="endScreen">
    <div class="trophy">🏆</div>
    <h2 class="end-title" id="endTitle">Hebat sekali!</h2>
    <p class="end-sub" id="endSub">Kamu jawab benar 0 dari 10 soal</p>
    <p class="new-best" id="newBestText"></p>
    <div class="stars" id="endStars"></div>
    <div class="end-buttons">
      <button id="retryBtn">Ulangi Level</button>
      <button id="toHomeBtn">Pilih Level</button>
    </div>
  </div>
</div>

<script>
/* ================= BANK SOAL: 3 level x 10 soal ================= */
const LEVELS = [
  {
    id:1, name:"Level 1", desc:"Dasar • Warna, Hewan, Angka",
    soal:[
      {q:"Berapa jumlah kaki kucing?", opts:[{t:"2",e:"2️⃣"},{t:"4",e:"4️⃣"},{t:"6",e:"6️⃣"},{t:"8",e:"8️⃣"}], correct:1},
      {q:"Warna apa kalau merah dicampur kuning?", opts:[{t:"Oranye",e:"🟠"},{t:"Hijau",e:"🟢"},{t:"Ungu",e:"🟣"},{t:"Biru",e:"🔵"}], correct:0},
      {q:"Hewan apa yang bisa terbang?", opts:[{t:"Kucing",e:"🐱"},{t:"Burung",e:"🐦"},{t:"Ikan",e:"🐟"},{t:"Sapi",e:"🐄"}], correct:1},
      {q:"Berapa jumlah hari dalam seminggu?", opts:[{t:"5",e:"5️⃣"},{t:"6",e:"6️⃣"},{t:"7",e:"7️⃣"},{t:"8",e:"8️⃣"}], correct:2},
      {q:"Apa yang kita pakai untuk melihat?", opts:[{t:"Telinga",e:"👂"},{t:"Mata",e:"👀"},{t:"Hidung",e:"👃"},{t:"Mulut",e:"👄"}], correct:1},
      {q:"Buah apa yang kuning dan melengkung?", opts:[{t:"Apel",e:"🍎"},{t:"Pisang",e:"🍌"},{t:"Jeruk",e:"🍊"},{t:"Anggur",e:"🍇"}], correct:1},
      {q:"Hewan apa yang suka menggonggong?", opts:[{t:"Kucing",e:"🐱"},{t:"Anjing",e:"🐶"},{t:"Ayam",e:"🐔"},{t:"Ikan",e:"🐟"}], correct:1},
      {q:"Berapa jumlah jari di satu tangan?", opts:[{t:"4",e:"4️⃣"},{t:"5",e:"5️⃣"},{t:"6",e:"6️⃣"},{t:"10",e:"🔟"}], correct:1},
      {q:"Di mana kita belajar bersama guru?", opts:[{t:"Pasar",e:"🏪"},{t:"Sekolah",e:"🏫"},{t:"Kebun",e:"🌳"},{t:"Kolam",e:"🏊"}], correct:1},
      {q:"Bentuk apa yang punya 3 sisi?", opts:[{t:"Lingkaran",e:"⚪"},{t:"Segitiga",e:"🔺"},{t:"Persegi",e:"⬜"},{t:"Bintang",e:"⭐"}], correct:1}
    ]
  },
  {
    id:2, name:"Level 2", desc:"Sedang • Alam & Sehari-hari",
    soal:[
      {q:"Matahari terbit dari arah mana?", opts:[{t:"Barat",e:"🌇"},{t:"Utara",e:"🧭"},{t:"Timur",e:"🌅"},{t:"Selatan",e:"🧭"}], correct:2},
      {q:"Air yang dibekukan jadi apa?", opts:[{t:"Uap",e:"💨"},{t:"Es",e:"🧊"},{t:"Awan",e:"☁️"},{t:"Pelangi",e:"🌈"}], correct:1},
      {q:"Hewan apa yang hidup di air dan punya sirip?", opts:[{t:"Burung",e:"🐦"},{t:"Ikan",e:"🐟"},{t:"Kucing",e:"🐱"},{t:"Ular",e:"🐍"}], correct:1},
      {q:"Apa warna daun pada umumnya?", opts:[{t:"Merah",e:"🔴"},{t:"Kuning",e:"🟡"},{t:"Hijau",e:"🟢"},{t:"Biru",e:"🔵"}], correct:2},
      {q:"Kita makan nasi pakai apa?", opts:[{t:"Sisir",e:"💇"},{t:"Sendok",e:"🥄"},{t:"Sikat gigi",e:"🪥"},{t:"Payung",e:"☂️"}], correct:1},
      {q:"Berapa jumlah bulan dalam satu tahun?", opts:[{t:"10",e:"🔟"},{t:"11",e:"1️⃣1️⃣"},{t:"12",e:"1️⃣2️⃣"},{t:"13",e:"1️⃣3️⃣"}], correct:2},
      {q:"Apa yang kita pakai untuk mendengar?", opts:[{t:"Mata",e:"👀"},{t:"Telinga",e:"👂"},{t:"Hidung",e:"👃"},{t:"Tangan",e:"✋"}], correct:1},
      {q:"Hewan apa yang dijuluki raja hutan?", opts:[{t:"Gajah",e:"🐘"},{t:"Singa",e:"🦁"},{t:"Kelinci",e:"🐰"},{t:"Kera",e:"🐒"}], correct:1},
      {q:"Kita tidur di mana?", opts:[{t:"Meja",e:"🪑"},{t:"Kasur",e:"🛏️"},{t:"Dapur",e:"🍳"},{t:"Kolam",e:"🏊"}], correct:1},
      {q:"Payung kita pakai kalau cuaca apa?", opts:[{t:"Hujan",e:"🌧️"},{t:"Panas terik saja",e:"☀️"},{t:"Berangin",e:"💨"},{t:"Berkabut",e:"🌫️"}], correct:0}
    ]
  },
  {
    id:3, name:"Level 3", desc:"Menantang • Pengetahuan Umum",
    soal:[
      {q:"Apa ibu kota Indonesia?", opts:[{t:"Bandung",e:"🏙️"},{t:"Jakarta",e:"🏙️"},{t:"Surabaya",e:"🏙️"},{t:"Medan",e:"🏙️"}], correct:1},
      {q:"Planet apa yang kita tinggali?", opts:[{t:"Mars",e:"🔴"},{t:"Bulan",e:"🌙"},{t:"Bumi",e:"🌍"},{t:"Matahari",e:"☀️"}], correct:2},
      {q:"Apa sumber cahaya utama di siang hari?", opts:[{t:"Bulan",e:"🌙"},{t:"Bintang",e:"⭐"},{t:"Matahari",e:"☀️"},{t:"Lampu",e:"💡"}], correct:2},
      {q:"Bendera Indonesia berwarna apa?", opts:[{t:"Merah Putih",e:"🇮🇩"},{t:"Biru Kuning",e:"🟦"},{t:"Hijau Putih",e:"🟩"},{t:"Merah Hitam",e:"🟥"}], correct:0},
      {q:"Berapa jumlah roda sepeda?", opts:[{t:"1",e:"1️⃣"},{t:"2",e:"2️⃣"},{t:"3",e:"3️⃣"},{t:"4",e:"4️⃣"}], correct:1},
      {q:"Ulat berubah menjadi hewan apa yang bisa terbang cantik?", opts:[{t:"Lebah",e:"🐝"},{t:"Kupu-kupu",e:"🦋"},{t:"Capung",e:"🐞"},{t:"Lalat",e:"🪰"}], correct:1},
      {q:"Selain air, apa yang dibutuhkan tumbuhan untuk tumbuh?", opts:[{t:"Sinar matahari",e:"☀️"},{t:"Es batu",e:"🧊"},{t:"Garam",e:"🧂"},{t:"Kertas",e:"📄"}], correct:0},
      {q:"Berapa jumlah sisi bangun persegi?", opts:[{t:"3",e:"3️⃣"},{t:"4",e:"4️⃣"},{t:"5",e:"5️⃣"},{t:"6",e:"6️⃣"}], correct:1},
      {q:"Pulau apa tempat kota Jakarta berada?", opts:[{t:"Sumatra",e:"🏝️"},{t:"Jawa",e:"🏝️"},{t:"Kalimantan",e:"🏝️"},{t:"Papua",e:"🏝️"}], correct:1},
      {q:"Apa yang kita gunakan untuk menulis?", opts:[{t:"Sendok",e:"🥄"},{t:"Pensil",e:"✏️"},{t:"Sikat",e:"🪥"},{t:"Piring",e:"🍽️"}], correct:1}
    ]
  }
];

/* ================= State ================= */
let currentLevel = null;      // objek level yg lagi dimainkan
let soalTerpilih = [];
let indexSoal = 0;
let skor = 0;
let sudahJawab = false;
let bestScores = {1:null, 2:null, 3:null}; // {best, stars, plays} per level id

/* ================= DOM refs ================= */
const homeScreen = document.getElementById('homeScreen');
const quizArea = document.getElementById('quizArea');
const endScreen = document.getElementById('endScreen');
const scorePill = document.getElementById('scorePill');
const levelList = document.getElementById('levelList');
const totalStarsEl = document.getElementById('totalStars');

const questionText = document.getElementById('questionText');
const answersGrid = document.getElementById('answersGrid');
const feedbackText = document.getElementById('feedbackText');
const nextBtn = document.getElementById('nextBtn');
const progressRow = document.getElementById('progressRow');
const scoreVal = document.getElementById('scoreVal');
const totalVal = document.getElementById('totalVal');
const mascot = document.getElementById('mascot');
const mouth = document.getElementById('mouth');
const backBtn = document.getElementById('backBtn');

const endTitle = document.getElementById('endTitle');
const endSub = document.getElementById('endSub');
const endStars = document.getElementById('endStars');
const newBestText = document.getElementById('newBestText');
const retryBtn = document.getElementById('retryBtn');
const toHomeBtn = document.getElementById('toHomeBtn');

/* ================= Helpers ================= */
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function pilihAcak(list){ return list[Math.floor(Math.random()*list.length)]; }
function hitungBintang(skor, total){
  const rasio = skor/total;
  if(rasio>=0.9) return 3;
  if(rasio>=0.6) return 2;
  if(rasio>0) return 1;
  return 0;
}

/* ================= Storage papan skor ================= */
async function muatSemuaSkor(){
  for(const lv of LEVELS){
    try{
      const res = await window.storage.get('kuispintar-level-'+lv.id, false);
      bestScores[lv.id] = res ? JSON.parse(res.value) : null;
    }catch(e){
      bestScores[lv.id] = null;
    }
  }
}
async function simpanSkor(levelId, skorBaru, totalSoal, bintangBaru){
  const lama = bestScores[levelId];
  const plays = (lama?.plays || 0) + 1;
  let jadiBest = false;
  let data;
  if(!lama || skorBaru > lama.best){
    data = {best:skorBaru, total:totalSoal, stars:bintangBaru, plays};
    jadiBest = !!lama && skorBaru > lama.best;
  } else {
    data = {...lama, plays};
  }
  bestScores[levelId] = data;
  try{
    await window.storage.set('kuispintar-level-'+levelId, JSON.stringify(data), false);
  }catch(e){ /* gagal simpan, tetap lanjut main */ }
  return jadiBest;
}

/* ================= Render Home ================= */
function renderHome(){
  levelList.innerHTML = '';
  let totalBintang = 0;
  LEVELS.forEach(lv=>{
    const data = bestScores[lv.id];
    if(data) totalBintang += data.stars;

    const card = document.createElement('div');
    card.className = 'level-card lv'+lv.id;
    const skorText = data ? `Terbaik: ${data.best}/${data.total} ${'⭐'.repeat(data.stars)}` : 'Belum pernah main';
    card.innerHTML = `
      <div class="level-badge">${lv.id}</div>
      <div class="level-info">
        <p class="level-name">${lv.name}</p>
        <p class="level-desc">${lv.desc}</p>
        <p class="level-score">${skorText}</p>
      </div>
      <div class="level-arrow">▶</div>
    `;
    card.addEventListener('click', ()=>mulaiLevel(lv));
    levelList.appendChild(card);
  });
  totalStarsEl.textContent = totalBintang;
}

function tampilkanHome(){
  homeScreen.classList.add('show');
  quizArea.style.display = 'none';
  endScreen.classList.remove('show');
  scorePill.style.display = 'none';
  renderHome();
}

/* ================= Quiz ================= */
function mulaiLevel(level){
  currentLevel = level;
  soalTerpilih = shuffle(level.soal).map(s=>{
    const optsWithIdx = s.opts.map((o,i)=>({...o, isCorrect:i===s.correct}));
    return {q:s.q, opts:shuffle(optsWithIdx)};
  });
  indexSoal = 0;
  skor = 0;
  totalVal.textContent = soalTerpilih.length;
  scoreVal.textContent = skor;

  homeScreen.classList.remove('show');
  endScreen.classList.remove('show');
  quizArea.style.display = 'block';
  scorePill.style.display = 'block';

  buildProgressDots();
  renderSoal();
}

function buildProgressDots(){
  progressRow.innerHTML = '';
  soalTerpilih.forEach((_,i)=>{
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = 'dot'+i;
    progressRow.appendChild(d);
  });
  updateDots();
}
function updateDots(){
  soalTerpilih.forEach((_,i)=>{
    const d = document.getElementById('dot'+i);
    d.className = 'dot' + (i<indexSoal?' done':'') + (i===indexSoal?' current':'');
  });
}

function renderSoal(){
  sudahJawab = false;
  feedbackText.textContent = '';
  nextBtn.classList.add('hidden');
  updateDots();
  setMascot('normal');

  const soal = soalTerpilih[indexSoal];
  questionText.textContent = soal.q;
  answersGrid.innerHTML = '';
  soal.opts.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.innerHTML = `<span class="emoji">${opt.e}</span><span>${opt.t}</span>`;
    btn.addEventListener('click', ()=>pilihJawaban(btn, opt.isCorrect));
    answersGrid.appendChild(btn);
  });
}

function pilihJawaban(btn, benar){
  if(sudahJawab) return;
  sudahJawab = true;

  const semuaBtn = answersGrid.querySelectorAll('.answer-btn');
  semuaBtn.forEach(b=>b.disabled = true);

  if(benar){
    btn.classList.add('correct');
    skor++;
    scoreVal.textContent = skor;
    feedbackText.textContent = pilihAcak(["Betul sekali! 🎉","Pintar! 👍","Yeay, benar! ✨","Keren!"]);
    setMascot('happy');
    tembakConfetti();
  } else {
    btn.classList.add('wrong');
    const idxBenar = [...semuaBtn].findIndex((b,i)=>soalTerpilih[indexSoal].opts[i].isCorrect);
    semuaBtn[idxBenar].classList.add('correct');
    feedbackText.textContent = pilihAcak(["Belum tepat, coba lagi ya lain kali!","Hampir! Yuk lihat jawaban benarnya.","Tidak apa-apa, ayo coba soal berikutnya!"]);
    setMascot('oops');
  }

  nextBtn.classList.remove('hidden');
  nextBtn.textContent = (indexSoal === soalTerpilih.length-1) ? 'Lihat Hasil 🏁' : 'Lanjut →';
}

function setMascot(state){
  mascot.classList.remove('happy','oops');
  if(state==='happy'){ mouth.setAttribute('d','M36,56 Q50,72 64,56'); mascot.classList.add('happy'); }
  else if(state==='oops'){ mouth.setAttribute('d','M38,62 Q50,54 62,62'); mascot.classList.add('oops'); }
  else{ mouth.setAttribute('d','M38,58 Q50,68 62,58'); }
}

function tembakConfetti(){
  const emojis = ['⭐','🎉','✨','🌟'];
  for(let i=0;i<14;i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = Math.random()*100+'vw';
    el.style.animationDuration = (2+Math.random()*1.5)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 3600);
  }
}

nextBtn.addEventListener('click', ()=>{
  indexSoal++;
  if(indexSoal >= soalTerpilih.length){ tampilkanHasilAkhir(); }
  else{ renderSoal(); }
});

backBtn.addEventListener('click', tampilkanHome);
toHomeBtn.addEventListener('click', tampilkanHome);
retryBtn.addEventListener('click', ()=>mulaiLevel(currentLevel));

async function tampilkanHasilAkhir(){
  quizArea.style.display = 'none';
  scorePill.style.display = 'none';
  endScreen.classList.add('show');
  endSub.textContent = `Kamu jawab benar ${skor} dari ${soalTerpilih.length} soal di ${currentLevel.name}`;

  const bintang = hitungBintang(skor, soalTerpilih.length);
  endStars.textContent = '⭐'.repeat(bintang) + '☆'.repeat(3-bintang);

  const jadiBest = await simpanSkor(currentLevel.id, skor, soalTerpilih.length, bintang);
  newBestText.textContent = jadiBest ? '🎉 Rekor baru!' : '';

  if(bintang===3) tembakConfetti();
}

/* ================= Mulai aplikasi ================= */
(async function init(){
  questionText.textContent = 'Memuat...';
  await muatSemuaSkor();
  tampilkanHome();
})();
</script>
