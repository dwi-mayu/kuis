<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kuis Pintar & Detektif Kata</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap');

:root {
  --sun: #FFC93C; --sky: #4FC3F7; --sky-deep: #29B6F6; 
  --pink: #FF6F91; --green: #6BCB77; --purple: #9B5DE5; 
  --ink: #2B2D42; --white: #FFFFFF; --gold: #FFD700;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  font-family: 'Nunito', sans-serif;
  background: linear-gradient(180deg, var(--sky) 0%, var(--sky-deep) 45%, #81D4FA 100%);
  display: flex; align-items: center; justify-content: center;
  padding: 20px 14px; position: relative;
}

/* --- Partikel Klik & Latar --- */
.click-sparkle {
  position: absolute; pointer-events: none; z-index: 9999;
  font-size: 20px; animation: sparkleAnim 0.6s ease-out forwards;
}
@keyframes sparkleAnim {
  0% { transform: scale(0) rotate(0deg); opacity: 1; }
  50% { transform: scale(1.5) rotate(90deg); opacity: 1; }
  100% { transform: translateY(-30px) scale(0.5) rotate(180deg); opacity: 0; }
}
.cloud { position: absolute; background: #fff; border-radius: 50px; opacity: .85; z-index: 1; }
.cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
.c1 { width: 90px; height: 34px; top: 6%; left: 6%; animation: drift 18s linear infinite; }
.c1::before { width: 46px; height: 46px; top: -22px; left: 10px; }
.c1::after { width: 34px; height: 34px; top: -16px; left: 46px; }
.c2 { width: 70px; height: 26px; top: 14%; right: 8%; animation: drift 24s linear infinite reverse; }
.c2::before { width: 36px; height: 36px; top: -18px; left: 8px; }
.c2::after { width: 26px; height: 26px; top: -12px; left: 34px; }
.c3 { width: 60px; height: 24px; bottom: 8%; left: 10%; animation: drift 20s linear infinite; }
.c3::before { width: 30px; height: 30px; top: -15px; left: 6px; }
.c3::after { width: 22px; height: 22px; top: -10px; left: 28px; }
@keyframes drift { 0% { transform: translateX(-30px); } 50% { transform: translateX(30px); } 100% { transform: translateX(-30px); } }
.balloon { position: absolute; font-size: 45px; z-index: 1; opacity: 0.8; animation: floatUp 15s ease-in-out infinite; }
.b1 { left: 10%; bottom: -10%; animation-duration: 20s; }
.b2 { right: 15%; bottom: -10%; animation-duration: 24s; animation-delay: 5s; }
@keyframes floatUp { 0% { transform: translateY(110vh) rotate(-10deg); } 100% { transform: translateY(-30vh) rotate(15deg); } }

/* --- Card Utama --- */
.card {
  position: relative; z-index: 2; width: 100%; max-width: 480px; max-height: 95vh; overflow-y: auto;
  background: var(--white); border-radius: 32px; padding: 26px 22px 30px;
  box-shadow: 0 20px 0 rgba(43,45,66,.12), 0 20px 40px rgba(43,45,66,.18);
}
.card::-webkit-scrollbar { display: none; }

/* --- Maskot --- */
.mascot-wrap { display: flex; justify-content: center; margin-top: -64px; margin-bottom: 6px; }
.mascot { width: 96px; height: 96px; animation: bob 2.4s ease-in-out infinite; transform-origin: center; }
.mascot-eye { animation: blink 4s infinite; transform-origin: center; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
@keyframes blink { 0%, 96%, 98%, 100% { transform: scaleY(1); } 97%, 99% { transform: scaleY(0.1); } }
.mascot.happy { animation: happyBounce .6s ease; }
@keyframes happyBounce { 0% { transform: scale(1); } 30% { transform: scale(1.25) rotate(8deg); } 60% { transform: scale(.95) rotate(-6deg); } 100% { transform: scale(1); } }
.mascot.oops { animation: shake .5s ease; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px) rotate(-4deg); } 40% { transform: translateX(8px) rotate(4deg); } 60% { transform: translateX(-6px) rotate(-3deg); } 80% { transform: translateX(6px) rotate(3deg); } }

h1.title { font-family: 'Baloo 2', cursive; text-align: center; color: var(--ink); font-size: 28px; margin: 0 0 4px; }
.subtitle { text-align: center; color: #6b6f8a; font-weight: 700; font-size: 15px; margin: 0 0 18px; }

/* --- Layar Transisi --- */
.screen { display: none; opacity: 0; animation: fadeInScreen 0.4s ease forwards; }
.screen.show { display: block; }
@keyframes fadeInScreen { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

/* --- Menu Utama --- */
.total-stars-pill {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  background: linear-gradient(90deg, #FFE9A8, #FFD46B); border-radius: 20px; padding: 8px 14px; margin: 0 auto 18px;
  font-family: 'Baloo 2', cursive; font-weight: 800; color: var(--ink); font-size: 15px; width: fit-content; box-shadow: 0 4px 0 #E5BE50;
}
.level-list { display: flex; flex-direction: column; gap: 14px; }
.level-card {
  display: flex; align-items: center; gap: 14px; background: #F4F6FB; border: 3px solid #E4E8F5; border-radius: 20px;
  padding: 14px 16px; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease;
}
.level-card:active { transform: scale(.97); }
.level-card:hover { border-color: var(--sky-deep); transform: translateY(-2px); box-shadow: 0 6px 0 #E4E8F5; }
.level-badge {
  width: 54px; height: 54px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
  font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 24px; color: #fff; flex-shrink: 0; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15);
}
.lv1 .level-badge { background: var(--green); } .lv2 .level-badge { background: var(--sky-deep); } .lv3 .level-badge { background: var(--purple); }

.level-card.bonus-stage { background: linear-gradient(135deg, #FFF6DE, #FFEDAD); border-color: var(--gold); animation: glow 2s infinite alternate; }
.level-card.bonus-stage .level-badge { background: var(--pink); font-size: 28px; }
.level-card.word-search { background: linear-gradient(135deg, #E4F9E6, #C8E6C9); border-color: var(--green); }
@keyframes glow { from { box-shadow: 0 0 5px rgba(255,215,0,0.2); } to { box-shadow: 0 0 15px rgba(255,215,0,0.6), 0 5px 0 #E5BE50; } }

.level-info { flex: 1; min-width: 0; }
.level-name { font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 17px; color: var(--ink); margin: 0 0 3px; }
.level-desc { font-size: 13px; color: #8085a3; font-weight: 700; margin: 0 0 4px; }
.level-score { font-size: 14px; font-weight: 800; color: var(--purple); }

/* --- Area Kuis --- */
.progress-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
.dot { width: 18px; height: 10px; border-radius: 5px; background: #EDEFF7; transition: all .4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.dot.done { background: var(--green); } .dot.current { background: var(--purple); width: 34px; }

.question-box {
  background: linear-gradient(135deg, #FFF6DE, #FFEFC2); border-radius: 22px; padding: 22px 18px; text-align: center;
  margin-bottom: 18px; min-height: 90px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 0 #F3DF9A;
}
.question-box p { font-family: 'Baloo 2', cursive; font-size: 20px; color: var(--ink); margin: 0; line-height: 1.35; }
.read-btn {
  margin-top: 10px; background: #fff; border: 2px solid #FFD46B; color: #D4A017; font-family: 'Nunito', sans-serif;
  font-weight: 800; font-size: 13px; padding: 6px 14px; border-radius: 20px; cursor: pointer; transition: all 0.2s; box-shadow: 0 3px 0 #FFD46B;
}
.read-btn:active { transform: translateY(3px); box-shadow: 0 0px 0 #FFD46B; }

.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.answer-btn {
  font-family: 'Baloo 2', cursive; font-size: 16px; font-weight: 800; color: var(--ink);
  background: #F4F6FB; border: 3px solid #E4E8F5; border-radius: 20px; padding: 16px 8px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 8px; transition: transform .12s ease, box-shadow .12s ease; user-select: none;
}
.answer-btn .emoji { font-size: 34px; transition: transform 0.3s; }
.answer-btn:active { transform: scale(.96); }
.answer-btn:not(:disabled):hover { transform: translateY(-3px); box-shadow: 0 6px 0 #E4E8F5; border-color: var(--sky-deep); }
.answer-btn.correct { background: #E4F9E6; border-color: var(--green); color: #237A3A; animation: popIn 0.3s ease forwards; }
.answer-btn.wrong { background: #FFE7EC; border-color: var(--pink); color: #B23355; animation: shake 0.4s ease; }
.answer-btn:disabled { cursor: default; }
.answer-btn:disabled:not(.correct):not(.wrong) { opacity: .5; filter: grayscale(50%); }

/* --- AREA CARI KATA (DI-UPGRADE KE 8x8) --- */
.ws-grid {
  display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; /* Grid 8 kolom */
  background: #E4E8F5; padding: 10px; border-radius: 18px; margin-bottom: 16px;
}
.ws-cell {
  aspect-ratio: 1; background: #fff; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Baloo 2', cursive; font-size: 20px; font-weight: 800; color: var(--ink);
  cursor: pointer; user-select: none; transition: all 0.2s; box-shadow: 0 3px 0 #D1D6E8;
}
.ws-cell:active { transform: translateY(2px); box-shadow: 0 1px 0 #D1D6E8; }
.ws-cell.selected { background: var(--purple); color: #fff; box-shadow: 0 3px 0 #7238C9; transform: translateY(-2px); }
.ws-cell.found { background: var(--green); color: #fff; box-shadow: 0 3px 0 #4CAF50; animation: popIn 0.4s ease; cursor: default; }

.ws-word-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 10px;}
.ws-word {
  background: #F4F6FB; padding: 6px 12px; border-radius: 14px;
  font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 14px; color: var(--ink); border: 2px solid #E4E8F5; transition: all 0.3s;
}
.ws-word.found { text-decoration: line-through; opacity: 0.5; background: #E4F9E6; border-color: var(--green); color: #237A3A; }

.feedback-wrap { text-align: center; min-height: 40px; margin-top: 14px; }
.feedback-text { font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 19px; color: var(--purple); margin: 0; }
.combo-text { font-size: 14px; color: var(--pink); font-weight: 800; animation: popIn 0.3s ease; margin: 2px 0 0 0; }

.next-btn {
  display: block; width: 100%; margin-top: 8px; font-family: 'Baloo 2', cursive; font-size: 18px; font-weight: 800;
  color: #fff; background: var(--purple); border: none; border-radius: 16px; padding: 15px; cursor: pointer; box-shadow: 0 6px 0 #7238C9; transition: transform .1s ease;
}
.next-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #7238C9; }
.next-btn.hidden { display: none; }

.back-btn { background: none; border: none; color: #8085a3; font-weight: 800; font-size: 14px; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; padding: 4px 0; }
.back-btn:hover { color: var(--pink); }

.top-ui { position: absolute; top: 16px; width: calc(100% - 32px); display: flex; justify-content: space-between; z-index: 3; pointer-events: none; }
.top-ui > * { pointer-events: auto; }
.mute-btn { width: 44px; height: 44px; border-radius: 50%; background: #fff; border: 3px solid #E4E8F5; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #E4E8F5; transition: transform .12s ease; }
.mute-btn:active { transform: scale(.9); }
.score-pill { background: var(--sun); color: var(--ink); font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 16px; padding: 6px 14px; border-radius: 20px; box-shadow: 0 4px 0 #E0A800; display: flex; align-items: center; gap: 6px; }

/* --- Layar Akhir --- */
.end-screen { text-align: center; }
.trophy { font-size: 80px; margin-bottom: 10px; animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.end-title { font-family: 'Baloo 2', cursive; font-size: 28px; color: var(--ink); margin: 0 0 6px; }
.end-sub { color: #6b6f8a; font-weight: 700; font-size: 16px; margin: 0 0 8px; }
.new-best { color: var(--pink); font-weight: 800; font-size: 15px; margin: 0 0 16px; min-height: 20px; animation: glowText 1.5s infinite alternate; }
@keyframes glowText { from { text-shadow: 0 0 5px rgba(255,111,145,0.4); } to { text-shadow: 0 0 15px rgba(255,111,145,0.8); } }
.stars { font-size: 45px; letter-spacing: 8px; margin-bottom: 24px; text-shadow: 0 4px 0 rgba(0,0,0,0.1); }
.end-buttons { display: flex; gap: 12px; }
.end-buttons button { flex: 1; font-family: 'Baloo 2', cursive; font-size: 16px; font-weight: 800; color: #fff; border: none; border-radius: 16px; padding: 15px 8px; cursor: pointer; transition: transform .1s ease; }
#retryBtn { background: var(--pink); box-shadow: 0 6px 0 #D4506D; } #retryBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #D4506D; }
#toHomeBtn { background: var(--sky-deep); box-shadow: 0 6px 0 #1E88C7; } #toHomeBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1E88C7; }
.confetti { position: fixed; top: -10px; z-index: 10; pointer-events: none; font-size: 28px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0; } }

@media (max-width: 380px) {
  .card { padding: 22px 16px 24px; border-radius: 26px; }
  .question-box p { font-size: 18px; } .answer-btn { font-size: 14px; padding: 13px 6px; } .answer-btn .emoji { font-size: 28px; }
  .ws-cell { font-size: 16px; border-radius: 6px;} /* Font diperkecil agar pas 8 kolom di layar kecil */
}
</style>
</head>
<body>

<div class="cloud c1"></div> <div class="cloud c2"></div> <div class="cloud c3"></div>
<div class="balloon b1">🎈</div> <div class="balloon b2">🚀</div>

<div class="card">
  <div class="top-ui">
    <button class="mute-btn" id="muteBtn">🔊</button>
    <div class="score-pill" id="scorePill" style="display: none;">⭐ <span id="scoreVal">0</span>/<span id="totalVal">10</span></div>
  </div>

  <div class="mascot-wrap">
    <svg class="mascot" id="mascot" viewBox="0 0 100 100">
      <g stroke="#FFB300" stroke-width="6" stroke-linecap="round">
        <line x1="50" y1="4" x2="50" y2="16"/><line x1="50" y1="84" x2="50" y2="96"/>
        <line x1="4" y1="50" x2="16" y2="50"/><line x1="84" y1="50" x2="96" y2="50"/>
        <line x1="16" y1="16" x2="24" y2="24"/><line x1="76" y1="76" x2="84" y2="84"/>
        <line x1="84" y1="16" x2="76" y2="24"/><line x1="16" y1="84" x2="24" y2="76"/>
      </g>
      <circle cx="50" cy="50" r="30" fill="#FFC93C"/>
      <circle cx="40" cy="46" r="4.5" fill="#2B2D42" class="mascot-eye"/>
      <circle cx="60" cy="46" r="4.5" fill="#2B2D42" class="mascot-eye"/>
      <path id="mouth" d="M38,58 Q50,68 62,58" stroke="#2B2D42" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="32" cy="56" r="5" fill="#FF9AAE" opacity=".7"/>
      <circle cx="68" cy="56" r="5" fill="#FF9AAE" opacity=".7"/>
    </svg>
  </div>

  <h1 class="title">Kuis Pintar Ceria</h1>

  <!-- SCREEN 1: HOME -->
  <div id="homeScreen" class="screen show">
    <p class="subtitle">Ayo pilih permainanmu hari ini!</p>
    <div class="total-stars-pill">🏆 Bintang Kuis: <span id="totalStars">0</span>/12</div>
    <div class="level-list" id="levelList"></div>
  </div>

  <!-- SCREEN 2: QUIZ -->
  <div id="quizArea" class="screen">
    <button class="back-btn" id="backBtn">← Kembali ke Menu</button>
    <div class="progress-row" id="progressRow"></div>
    <div class="question-box">
      <p id="questionText">Memuat soal...</p>
      <button class="read-btn" id="readBtn">📢 Baca Soal</button>
    </div>
    <div class="answers" id="answersGrid"></div>
    <div class="feedback-wrap">
      <p class="feedback-text" id="feedbackText"></p>
      <p class="combo-text" id="comboText"></p>
    </div>
    <button class="next-btn hidden" id="nextBtn">Lanjut &rarr;</button>
  </div>

  <!-- SCREEN 3: WORD SEARCH (CARI KATA 8x8) -->
  <div id="wordSearchArea" class="screen">
    <button class="back-btn" id="wsBackBtn">← Kembali ke Menu</button>
    <div class="subtitle" style="margin-bottom:8px; color:var(--purple);">
      Tekan huruf-huruf untuk menyusun kata!<br>
      <span style="font-size:12px; color:var(--pink);">💡 Tips: Kata bisa mendatar, menurun, atau menyilang!</span>
    </div>
    
    <div class="ws-grid" id="wsGrid"></div>
    <div class="ws-word-list" id="wsWordList"></div>
    
    <div class="feedback-wrap">
      <p class="feedback-text" id="wsFeedbackText" style="color:var(--pink);"></p>
    </div>
  </div>

  <!-- SCREEN 4: END -->
  <div id="endScreen" class="screen">
    <div class="trophy">🏆</div>
    <h2 class="end-title" id="endTitle">Hebat sekali!</h2>
    <p class="end-sub" id="endSub">Kamu jawab benar 0 dari 10 soal</p>
    <p class="new-best" id="newBestText"></p>
    <div class="stars" id="endStars"></div>
    <div class="end-buttons">
      <button id="retryBtn">🔄 Main Lagi</button>
      <button id="toHomeBtn">🏠 Pilih Menu</button>
    </div>
  </div>
</div>

<script>
/* ================= EFEK PARTIKEL BINTANG KLIK ================= */
document.addEventListener('click', (e) => {
  if(e.target.closest('button') || e.target.closest('.ws-cell')) return; 
  const sparkle = document.createElement('div');
  sparkle.className = 'click-sparkle'; sparkle.textContent = '✨';
  sparkle.style.left = (e.clientX - 10) + 'px'; sparkle.style.top = (e.clientY - 10) + 'px';
  document.body.appendChild(sparkle); setTimeout(() => sparkle.remove(), 600);
});

/* ================= BANK SOAL KUIS & TEKA-TEKI ================= */
const LEVELS = [
  {
    id: 1, name: "Kelas 1 & 2", desc: "Matematika Dasar & Lingkungan",
    soal: [
      {q: "Berapa hasil dari 5 + 4 ?", opts: [{t:"8",e:"8️⃣"},{t:"9",e:"9️⃣"},{t:"10",e:"🔟"},{t:"7",e:"7️⃣"}], correct: 1},
      {q: "Hewan apa yang sangat suka makan wortel?", opts: [{t:"Kucing",e:"🐱"},{t:"Anjing",e:"🐶"},{t:"Kelinci",e:"🐰"},{t:"Sapi",e:"🐄"}], correct: 2},
      {q: "Warna bendera negara Indonesia adalah?", opts: [{t:"Merah Putih",e:"🇮🇩"},{t:"Biru Kuning",e:"🟦"},{t:"Hijau Putih",e:"🟩"},{t:"Hitam Merah",e:"🟥"}], correct: 0},
      {q: "Sebelum hari Selasa adalah hari apa?", opts: [{t:"Senin",e:"📅"},{t:"Rabu",e:"📅"},{t:"Kamis",e:"📅"},{t:"Minggu",e:"📅"}], correct: 0},
      {q: "Benda langit yang bersinar terang di malam hari?", opts: [{t:"Matahari",e:"☀️"},{t:"Bulan",e:"🌙"},{t:"Pelangi",e:"🌈"},{t:"Awan",e:"☁️"}], correct: 1}
    ]
  },
  {
    id: 2, name: "Kelas 3", desc: "Pengetahuan Lingkungan & Hitungan",
    soal: [
      {q: "Berapa hasil dari 15 + 10 ?", opts: [{t:"20",e:"🧮"},{t:"25",e:"🧮"},{t:"30",e:"🧮"},{t:"35",e:"🧮"}], correct: 1},
      {q: "Ikan bernapas di dalam air menggunakan?", opts: [{t:"Paru-paru",e:"🫁"},{t:"Kulit",e:"💧"},{t:"Insang",e:"🐟"},{t:"Hidung",e:"👃"}], correct: 2},
      {q: "Air yang dipanaskan terus menerus akan menjadi?", opts: [{t:"Es",e:"🧊"},{t:"Uap",e:"💨"},{t:"Batu",e:"🪨"},{t:"Salju",e:"❄️"}], correct: 1},
      {q: "Ibu kota dari negara kita Indonesia adalah?", opts: [{t:"Surabaya",e:"🏙️"},{t:"Bandung",e:"🏙️"},{t:"Jakarta",e:"🏙️"},{t:"Medan",e:"🏙️"}], correct: 2},
      {q: "Hewan apa yang dijuluki si leher panjang?", opts: [{t:"Gajah",e:"🐘"},{t:"Jerapah",e:"🦒"},{t:"Singa",e:"🦁"},{t:"Kuda nil",e:"🦛"}], correct: 1}
    ]
  },
  {
    id: 3, name: "Kelas 4", desc: "Pengetahuan Umum & Sains",
    soal: [

/* ================= Audio & Musik ================= */
let audioCtx = null; let musicEnabled = true; let melodyIndex = 0; let melodyTimeoutId = null;
const MELODY = [{f:523.25,d:0.35},{f:587.33,d:0.35},{f:659.25,d:0.35},{f:523.25,d:0.35},{f:659.25,d:0.35},{f:698.46,d:0.35},{f:783.99,d:0.7},{f:659.25,d:0.35},{f:587.33,d:0.35},{f:523.25,d:0.7}];

function getAudioCtx(){
  if(!audioCtx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null; audioCtx = new AC(); }
  if(audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx;
}
function playTone(freq, startOffset, duration, type='sine', vol=0.15){
  const ctx = getAudioCtx(); if(!ctx) return;
  const osc = ctx.createOscillator(); const gain = ctx.createGain();
  osc.type = type; osc.frequency.value = freq; const t0 = ctx.currentTime + startOffset;
  gain.gain.setValueAtTime(0, t0); gain.gain.linearRampToValueAtTime(vol, t0+0.02); gain.gain.exponentialRampToValueAtTime(0.001, t0+duration);
  osc.connect(gain).connect(ctx.destination); osc.start(t0); osc.stop(t0+duration+0.05);
}
function playClick(){ if(musicEnabled) playTone(600,0,0.08,'square',0.1); }
function playCorrect(){ if(!musicEnabled) return; playTone(523.25,0,0.12,'triangle',0.2); playTone(659.25,0.1,0.12,'triangle',0.2); playTone(783.99,0.2,0.22,'triangle',0.22); }
function playWrong(){ if(!musicEnabled) return; playTone(320,0,0.18,'sine',0.14); playTone(240,0.13,0.28,'sine',0.14); }
function playLevelComplete(bintang){
  if(!musicEnabled) return;
  const notes = bintang>=3 ? [523.25,523.25,523.25,659.25,783.99,1046.5] : [523.25,587.33,659.25];
  notes.forEach((f,i)=>playTone(f, i*0.13, 0.2, 'triangle', 0.2));
}

function scheduleNextNote(){
  if(!musicEnabled){ melodyTimeoutId = null; return; }
  const note = MELODY[melodyIndex % MELODY.length]; playTone(note.f, 0, note.d*0.85, 'triangle', 0.045);
  melodyIndex++; melodyTimeoutId = setTimeout(scheduleNextNote, note.d*1000);
}
function startMusic(){ if(!melodyTimeoutId && musicEnabled) scheduleNextNote(); }
function stopMusic(){ if(melodyTimeoutId){ clearTimeout(melodyTimeoutId); melodyTimeoutId=null; } }

document.getElementById('muteBtn').addEventListener('click', function(){
  musicEnabled = !musicEnabled; this.textContent = musicEnabled ? '🔊' : '🔇';
  if(musicEnabled){ getAudioCtx(); startMusic(); } else { stopMusic(); window.speechSynthesis.cancel(); }
});

function unlockAudioOnce(){ getAudioCtx(); if(musicEnabled) startMusic(); document.removeEventListener('click', unlockAudioOnce); document.removeEventListener('touchstart', unlockAudioOnce); }
document.addEventListener('click', unlockAudioOnce); document.addEventListener('touchstart', unlockAudioOnce);

/* ================= State & Transisi Global ================= */
let currentMode = 'quiz'; // 'quiz' atau 'wordsearch'
let currentLevel = null; let soalTerpilih = []; let indexSoal = 0; let skor = 0; let streak = 0;
let sudahJawab = false; let bestScores = {1:null, 2:null, 3:null, 4:null};

function switchScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('show'));
  setTimeout(() => document.getElementById(screenId).classList.add('show'), 50); 
}

/* ================= Render Menu Utama ================= */
async function muatSemuaSkor(){
  for(const lv of LEVELS){ try{ const raw = localStorage.getItem('kuispintar-v4-'+lv.id); bestScores[lv.id] = raw ? JSON.parse(raw) : null; }catch(e){} }
}
async function simpanSkor(levelId, skorBaru, totalSoal, bintangBaru){
  const lama = bestScores[levelId];
  let jadiBest = (!lama || skorBaru > lama.best);
  bestScores[levelId] = jadiBest ? {best:skorBaru, total:totalSoal, stars:bintangBaru} : lama;
  try{ localStorage.setItem('kuispintar-v4-'+levelId, JSON.stringify(bestScores[levelId])); }catch(e){}
  return jadiBest;
}

function renderHome(){
  currentMode = 'menu';
  const levelList = document.getElementById('levelList'); levelList.innerHTML = '';
  let totalBintang = 0;
  
  // Render Kuis & Teka-teki
  LEVELS.forEach(lv=>{
    const data = bestScores[lv.id]; if(data) totalBintang += data.stars;
    const card = document.createElement('div'); card.className = `level-card lv${lv.id} ${lv.isBonus ? 'bonus-stage' : ''}`;
    card.innerHTML = `<div class="level-badge">${lv.isBonus ? '🌟' : lv.id}</div>
      <div class="level-info">
        <p class="level-name">${lv.name}</p><p class="level-desc">${lv.desc}</p>
        <p class="level-score">${data ? `Skor: ${data.best}/${data.total} ${'⭐'.repeat(data.stars)}` : 'Belum dimainkan'}</p>
      </div><div class="level-arrow">▶</div>`;
    card.addEventListener('click', ()=>{ playClick(); currentMode = 'quiz'; mulaiLevel(lv); }); 
    levelList.appendChild(card);
  });

  // Render Kartu Spesial "Cari Kata"
  const wsCard = document.createElement('div');
  wsCard.className = `level-card word-search`;
  wsCard.innerHTML = `<div class="level-badge" style="background:var(--green);font-size:26px;">🔍</div>
    <div class="level-info">
      <p class="level-name">Detektif Kata</p><p class="level-desc">Level Ekstra Sulit (Diagonal!)</p>
      <p class="level-score">Mainkan Sekarang!</p>
    </div><div class="level-arrow">▶</div>`;
  wsCard.addEventListener('click', ()=>{ playClick(); currentMode = 'wordsearch'; mulaiCariKata(); });
  levelList.appendChild(wsCard);

  document.getElementById('totalStars').textContent = totalBintang;
  switchScreen('homeScreen'); document.getElementById('scorePill').style.display = 'none';
}

/* ================= LOGIKA KUIS ================= */
function mulaiLevel(level){
  currentLevel = level;
  soalTerpilih = [...level.soal].sort(()=>Math.random()-0.5).map(s=>({...s, opts: [...s.opts].map((o,i)=>({...o, ok:i===s.correct})).sort(()=>Math.random()-0.5)}));
  indexSoal = 0; skor = 0; streak = 0;
  document.getElementById('totalVal').textContent = soalTerpilih.length; document.getElementById('scoreVal').textContent = skor;
  switchScreen('quizArea'); document.getElementById('scorePill').style.display = 'flex';
  renderProgress(); renderSoal();
}

function renderProgress(){
  const row = document.getElementById('progressRow'); row.innerHTML = '';
  soalTerpilih.forEach((_,i)=>{ const d=document.createElement('div'); d.className='dot'; d.id='dot'+i; row.appendChild(d); });
}

function renderSoal(){
  sudahJawab = false;
  document.getElementById('feedbackText').textContent = ''; document.getElementById('comboText').textContent = '';
  document.getElementById('nextBtn').classList.add('hidden');
  soalTerpilih.forEach((_,i)=>document.getElementById('dot'+i).className = 'dot' + (i<indexSoal?' done':'') + (i===indexSoal?' current':''));
  setMascot('normal');

  const soal = soalTerpilih[indexSoal];
  document.getElementById('questionText').textContent = soal.q;
  const grid = document.getElementById('answersGrid'); grid.innerHTML = '';
  soal.opts.forEach(opt=>{
    const btn = document.createElement('button'); btn.className = 'answer-btn';
    btn.innerHTML = `<span class="emoji">${opt.e}</span><span>${opt.t}</span>`;
    btn.addEventListener('click', ()=>cekJawaban(btn, opt.ok)); grid.appendChild(btn);
  });
}

document.getElementById('readBtn').addEventListener('click', () => {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(soalTerpilih[indexSoal].q);
  msg.lang = 'id-ID'; msg.rate = 0.9; msg.pitch = 1.2;
  window.speechSynthesis.speak(msg);
});

function cekJawaban(btn, benar){
  if(sudahJawab) return; sudahJawab = true;
  window.speechSynthesis.cancel();
  const semuaBtn = document.querySelectorAll('.answer-btn'); semuaBtn.forEach(b=>b.disabled = true);

  if(benar){
    btn.classList.add('correct'); skor++; streak++;
    document.getElementById('scoreVal').textContent = skor;
    document.getElementById('feedbackText').textContent = ["Wah Pintar! 🎉","Hebat! 👍","Jawaban Tepat! ✨"][Math.floor(Math.random()*3)];
    if(streak >= 2) document.getElementById('comboText').textContent = `🔥 ${streak}x Jawaban Benar Beruntun!`;
    setMascot('happy'); tembakConfetti(10); playCorrect();
  } else {
    btn.classList.add('wrong'); streak = 0;
    const idxBenar = [...semuaBtn].findIndex((b,i)=>soalTerpilih[indexSoal].opts[i].ok);
    semuaBtn[idxBenar].classList.add('correct');
    document.getElementById('feedbackText').textContent = "Ayo coba lagi nanti! 💪";
    setMascot('oops'); playWrong();
  }
  const nxt = document.getElementById('nextBtn'); nxt.classList.remove('hidden');
  nxt.textContent = (indexSoal === soalTerpilih.length-1) ? 'Lihat Hasil Akhir 🏁' : 'Lanjut Soal →';
}

function setMascot(st){
  const m=document.getElementById('mascot'); const mth=document.getElementById('mouth'); m.classList.remove('happy','oops');
  if(st==='happy'){ mth.setAttribute('d','M36,56 Q50,72 64,56'); m.classList.add('happy'); }
  else if(st==='oops'){ mth.setAttribute('d','M38,62 Q50,54 62,62'); m.classList.add('oops'); }
  else{ mth.setAttribute('d','M38,58 Q50,68 62,58'); }
}

function tembakConfetti(jml=18){
  const emojis = ['⭐','🎉','✨','🌟','🎈'];
  for(let i=0;i<jml;i++){
    const el = document.createElement('div'); el.className = 'confetti';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = Math.random()*100+'vw'; el.style.animationDuration = (2+Math.random()*2)+'s';
    document.body.appendChild(el); setTimeout(()=>el.remove(), 4000);
  }
}

document.getElementById('nextBtn').addEventListener('click', ()=>{ playClick(); indexSoal++; if(indexSoal>=soalTerpilih.length) tampilkanHasilKuis(); else renderSoal(); });

async function tampilkanHasilKuis(){
  switchScreen('endScreen'); document.getElementById('scorePill').style.display = 'none';
  document.getElementById('endTitle').textContent = "Hebat Sekali!";
  document.getElementById('endSub').textContent = `Menjawab ${skor} dari ${soalTerpilih.length} soal`;
  const btg = skor/soalTerpilih.length >= 0.9 ? 3 : (skor/soalTerpilih.length >= 0.6 ? 2 : (skor>0 ? 1 : 0));
  document.getElementById('endStars').textContent = '⭐'.repeat(btg) + '☆'.repeat(3-btg);
  const isBest = await simpanSkor(currentLevel.id, skor, soalTerpilih.length, btg);
  document.getElementById('newBestText').textContent = isBest ? '🎉 Rekor Skor Baru!' : 'Terus Berlatih ya!';
  playLevelComplete(btg); if(btg===3) tembakConfetti(30);
}

/* ================= LOGIKA CARI KATA (8x8) ================= */
// Grid 8x8 rahasia yang sudah saya rancang khusus agar berpotongan secara rapi
const WS_LETTERS = [
  'M','A','T','A','H','A','R','I',
  'P','B','C','D','E','L','F','S',
  'G','R','H','I','I','J','K','E',
  'M','N','A','S','O','P','Q','K',
  'R','S','N','M','T','U','V','O',
  'P','E','L','A','U','T','W','L',
  'P','X','Y','Z','A','K','B','A',
  'B','E','N','D','E','R','A','H'
];

// Kata Tersembunyi beserta Index posisinya di papan (0 sampai 63)
const WS_WORDS = [
  { text: "MATAHARI", indices: [0, 1, 2, 3, 4, 5, 6, 7], found: false },   // Mendatar
  { text: "SEKOLAH", indices: [15, 23, 31, 39, 47, 55, 63], found: false }, // Menurun
  { text: "PRAMUKA", indices: [8, 17, 26, 35, 44, 53, 62], found: false },  // Menyilang (Kiri Atas ke Kanan Bawah)
  { text: "BENDERA", indices: [56, 57, 58, 59, 60, 61, 62], found: false }, // Mendatar
  { text: "PELAUT", indices: [40, 41, 42, 43, 44, 45], found: false },      // Mendatar
  { text: "PENSIL", indices: [48, 41, 34, 27, 20, 13], found: false }       // Menyilang (Kiri Bawah ke Kanan Atas)
];

let wsSelected = [];

function mulaiCariKata() {
  WS_WORDS.forEach(w => w.found = false);
  wsSelected = [];
  renderWsGrid();
  renderWsList();
  document.getElementById('wsFeedbackText').textContent = '';
  switchScreen('wordSearchArea');
  document.getElementById('scorePill').style.display = 'none';
  setMascot('normal');
}

function renderWsGrid() {
  const grid = document.getElementById('wsGrid'); grid.innerHTML = '';
  WS_LETTERS.forEach((letter, i) => {
    const cell = document.createElement('div');
    cell.className = 'ws-cell'; cell.textContent = letter; cell.id = 'wscell-' + i;
    cell.addEventListener('click', () => clickWsCell(i, cell));
    grid.appendChild(cell);
  });
}

function renderWsList() {
  const list = document.getElementById('wsWordList'); list.innerHTML = '';
  WS_WORDS.forEach((w, i) => {
    const span = document.createElement('div');
    span.className = 'ws-word' + (w.found ? ' found' : '');
    span.textContent = w.text; span.id = 'wsword-' + i;
    list.appendChild(span);
  });
}

function clickWsCell(index, cellEl) {
  if(cellEl.classList.contains('found')) return;
  playClick();

  // Memilih/Batal pilih huruf
  if(wsSelected.includes(index)) {
    wsSelected = wsSelected.filter(x => x !== index);
    cellEl.classList.remove('selected');
  } else {
    wsSelected.push(index);
    cellEl.classList.add('selected');
  }

  checkWsWords();

  // Kata terpanjang di game ini adalah 8 huruf (MATAHARI).
  // Jika memilih lebih dari 8 kotak tapi salah, kotak di-reset.
  if(wsSelected.length >= 9) {
    playWrong(); setMascot('oops');
    document.getElementById('wsFeedbackText').textContent = "Bukan itu katanya, coba lagi! 🕵️‍♂️";
    setTimeout(() => { document.getElementById('wsFeedbackText').textContent = ''; setMascot('normal');}, 2000);
    clearWsSelection();
  }
}

function checkWsWords() {
  // Sortir pilihan anak dari kecil ke besar untuk mempermudah pengecekan (tak peduli klik dari belakang atau depan)
  const sortedSelected = [...wsSelected].sort((a,b)=>a-b).join(',');

  for(let i=0; i<WS_WORDS.length; i++) {
    let w = WS_WORDS[i];
    if(!w.found) {
      const sortedTarget = [...w.indices].sort((a,b)=>a-b).join(',');
      if(sortedSelected === sortedTarget) {
        w.found = true; playCorrect(); tembakConfetti(8); setMascot('happy');
        document.getElementById('wsFeedbackText').textContent = "Ketemu kata " + w.text + "! 🎉";

        w.indices.forEach(idx => {
           const c = document.getElementById('wscell-' + idx);
           c.classList.remove('selected'); c.classList.add('found');
        });
        document.getElementById('wsword-' + i).classList.add('found');
        wsSelected = []; 
        checkWsWin();
        return; 
      }
    }
  }
}

function clearWsSelection() {
  wsSelected.forEach(idx => { document.getElementById('wscell-' + idx).classList.remove('selected'); });
  wsSelected = [];
}

function checkWsWin() {
  const allFound = WS_WORDS.every(w => w.found);
  if(allFound) {
    setTimeout(() => {
      switchScreen('endScreen');
      document.getElementById('endTitle').textContent = "Misi Selesai!";
      document.getElementById('endSub').textContent = "Kamu berhasil menemukan ke-6 kata rahasia!";
      document.getElementById('endStars').textContent = "⭐⭐⭐";
      document.getElementById('newBestText').textContent = "Detektif Kata Terbaik! 🕵️‍♂️✨";
      playLevelComplete(3); tembakConfetti(40);
    }, 1200);
  }
}
